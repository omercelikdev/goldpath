# The heavy nightly proofs: the golden-manifest matrix + the full mutation gates.
# Public repo = free minutes; each shape/package is its own parallel job.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  gm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GmOneAuthDefault
            args: ""
          - name: GmOneOpenFlow
            args: "--auth none"
          - name: GmFourSimple
            args: "--db sqlserver --broker none --auth none"
          # GM-4's OTHER dimension: the same simple shape in clean-architecture — four
          # projects, the packages anchor riding Infrastructure, migrations owned there.
          - name: GmFourClean
            args: "--db sqlserver --broker none --auth none --layout clean-architecture"
          # GM-6's realizable half: a service head (own db, own manifest) + the YARP
          # gateway — built by the SAME verbs an adopter runs, with the ROUTED probe in
          # the generated smoke (gateway /api/health/ready answers through the chain).
          - name: GmSixGateway
            args: "--auth none"
            post: "new service Billing;new gateway"
          # The GROWN app: born lean, then grown by the adopter's own `goldpath add feature`
          # verbs — the CLI recipe path proven end to end (ai-sdlc-status: the verb had shipped
          # UNPROVEN). Five recipes cover the three recipe shapes: a plain registration
          # (audittrail, softdelete), a provider-gated one (locking), a jobs rider that brings
          # the console (bulk), and the one that births the bus + its broker resource (outbox).
          - name: GmGrown
            args: "--auth none --broker none"
            post: "add feature audittrail;add feature softdelete;add feature locking;add feature bulk;add feature outbox"
          # The in-solution worker's parity proof (T25's last gap, 2026-09-05): an AUTHED,
          # feature-bearing solution gains a jobs worker and a queue worker by the adopter's
          # own verb — both inherit the floor and the features, both boot behind the AppHost.
          - name: GmWorkerInSolution
            args: "--features audittrail --features softdelete --features multitenancy"
            post: "add worker eod --trigger jobs;add worker ingest --trigger queue"
          # The bulk-only customer: bulk (jobs + console riding along) with ONLY the app
          # database — no broker, no Redis. The module×infrastructure matrix's proof row.
          - name: GmBulkOnly
            args: "--features bulk --broker none --auth none"
          # Dotted solution names are the .NET norm (Company.Product) — issue #24's regression shape.
          - name: Gm.Dotted
            args: "--broker none --auth none"
          # The console's shape: an operational module composes it, and the generated
          # smoke proves it SERVES with its own bundle (no auth here, so the page is
          # reachable — the authed shapes below assert the 401 instead).
          - name: GmConsole
            args: "--features bulk --auth none"
          # The SAME shape with the auth floor up: the console's page must answer 401.
          # Without this row the guarded branch of the generated smoke is never executed —
          # the matrix had no shape combining auth with an operational module.
          - name: GmConsoleAuthed
            args: "--features bulk"
          - name: GmEverything
            args: "--features multitenancy --features audittrail --features softdelete --features idempotency --features dataprotection --features caching --features locking --features approvals --features fileexchange --features archival --features bulk --features notification --features campaign --auth none"
          - name: GmWorkerQueue
            args: ""
            template: goldpath-worker
          - name: GmWorkerSchedule
            args: "--trigger schedule"
            template: goldpath-worker
          - name: GmWorkerJobs
            args: "--trigger jobs"
            template: goldpath-worker
          # Worker concept parity (open-threads T25, 2026-09-03): the jobs worker with the
          # auth floor UP — the admin surface and the console must answer 401 — carrying the
          # table-owning features, on sqlserver so the jobs store provider flip is proven.
          - name: GmWorkerJobsAuthed
            args: "--trigger jobs --db sqlserver --auth openid --features audittrail --features softdelete --features locking --features fileexchange"
            template: goldpath-worker
          # The queue worker with every feature it can compose and NO auth: the tenant rides
          # the message header, the riders bring the jobs runtime next to the inbox, and the
          # console SERVES from the worker's own head.
          - name: GmWorkerQueueFeatures
            args: "--features multitenancy --features audittrail --features softdelete --features dataprotection --features locking --features notification --auth none"
            template: goldpath-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The GM lane packs a local feed, and that feed shadows nuget.org for the same
      # version — so the console it packs must carry its assets, or every shape with an
      # operational module serves a 500 where its console should be.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/console/pnpm-lock.yaml
      - name: ${{ matrix.name }}
        env:
          GOLDPATH_GM_TEMPLATE: ${{ matrix.template || 'goldpath-solution' }}
          GOLDPATH_GM_POST: ${{ matrix.post || '' }}
        run: ./scripts/validate-gm.sh "${{ matrix.name }}" ${{ matrix.args }}

  migrations-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: the three D7 proofs (H1 evidence, kept green forever)
        run: ./scripts/validate-migrations.sh

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The hosted-fit ten (issue #20): the six long-running packages OOM the 16 GB
        # runners even at concurrency 2 — they live in mutation-heavy.yml (dispatch-only)
        # and in the release checklist's local cadence.
        package: [Goldpath.Abstractions, Goldpath.Data, Goldpath.Idempotency, Goldpath.AuditTrail,
                  Goldpath.SoftDelete, Goldpath.DataProtection, Goldpath.MultiTenancy,
                  Goldpath.Locking, Goldpath.Auth, Goldpath.Cli, Goldpath.Approvals, Goldpath.FileExchange,
                  Goldpath.Console, Goldpath.Messaging, Goldpath.ServiceDefaults]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet tool restore
      - name: mutation gate (concurrency capped — hosted runners are 4 vCPU / 16 GB)
        env:
          GOLDPATH_MUTATION_CONCURRENCY: "2"
        run: bash scripts/mutation-gate.sh "${{ matrix.package }}"

  # Known CVEs in the dependency tree fail the night — the license gate's security twin.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: vulnerable packages (transitive included)
        run: |
          dotnet restore Goldpath.sln
          out=$(dotnet list Goldpath.sln package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -qi "has the following vulnerable packages"; then
            echo "::error::vulnerable packages found"; exit 1
          fi

  # The deterministic half of the eval harness: acceptance runners are portable and
  # green against committed artifacts. The LLM half (running the skills themselves)
  # stays deferred until an agent-in-CI story exists (foundation §12 / skills RFC).
  evals-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: pin the engine (published tool, not a checkout)
        run: dotnet tool install -g specdrift --version 0.4.2
      - name: runner syntax holds
        run: for f in evals/skills/*/accept.sh; do bash -n "$f"; done
      - name: breaker acceptance vs CorPay
        run: bash evals/skills/breaker/accept.sh samples/corpay

  # The console exit gate (console RFC D3): the REAL console driven against REAL Goldpath
  # apps — capability discovery, the confirm gate, a run reaching terminal, the repair
  # queue replayed, bulk's four-eyes gate and its keyset-paged report, the campaign
  # governor over a real broker, the notification evidence in all three kinds, archival's
  # chain/hold/erasure cycle, plus how the console behaves when it is REFUSED (auth floor
  # raised, tenant-scoped) and when the service dies mid-session. Dispatchable on its own.
  console-smoke:
    uses: ./.github/workflows/console-smoke.yml

  # The finance sample stays green forever: built against the PUBLISHED packages, its
  # unit contract tests and the real-AppHost smoke run nightly (samples/GAP-LEDGER.md
  # is this job's product when it goes red).
  sample-corpay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: build + unit contracts
        working-directory: samples/corpay
        run: |
          dotnet build CorPay.sln --nologo
          dotnet test tests/CorPay.Api.Tests/CorPay.Api.Tests.csproj --no-build --nologo
      - name: goldpath check (SPEC0212 — committed contract == built contract)
        working-directory: samples/corpay
        # Absent from this lane, the committed spec sat a full train behind the built
        # one — the preview.4 export-completeness fix changed four responses and nothing
        # noticed until a release review read the diff. The reference app runs the same
        # verb it tells adopters to run.
        run: |
          dotnet tool install -g Goldpath.Cli --prerelease
          dotnet tool install -g specdrift
          goldpath check
      - name: smoke (real AppHost + containers)
        working-directory: samples/corpay
        run: dotnet test tests/CorPay.SmokeTests/CorPay.SmokeTests.csproj --no-build --nologo
        timeout-minutes: 20
