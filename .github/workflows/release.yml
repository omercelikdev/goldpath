# The publish half of the D4 release gate (docs/ops/release-checklist.md): tagging
# v<version> on a merged, green release PR packs the whole train (packages + CLI tool +
# template pack) and pushes to nuget.org via TRUSTED PUBLISHING — no stored secret: the
# workflow exchanges its GitHub OIDC token for a ~1h single-use key against the
# repository's Trusted Publishing policy on nuget.org.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the GitHub release
      id-token: write   # the OIDC token Trusted Publishing exchanges — and the one
                        # attest-build-provenance signs with (no key is stored either way)
      attestations: write   # the signed SLSA provenance attached to each .nupkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The console dist is BUILT here and embedded by Goldpath.Console: this is the ONLY
      # place Node is needed, and it is why adopters never run it. The package refuses to
      # pack without it (see its `RefuseAnEmptyConsole` target).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/console/pnpm-lock.yaml
      - name: build the console
        run: bash scripts/build-console.sh

      - name: sanity build
        run: dotnet build Goldpath.sln --nologo -c Release
      - name: pack the train
        run: |
          set -e
          mkdir -p out
          # No --no-build: the template pack is content-only (never in the sln build) and
          # pack re-verifies each project's own Release output deterministically.
          for p in packages/*/*.csproj analyzers/Goldpath.Analyzers/Goldpath.Analyzers.csproj \
                   tools/Goldpath.Cli/Goldpath.Cli.csproj templates/Goldpath.Templates.csproj; do
            # -p:GoldpathConsoleRequired=true arms the console package's own gate: this is
            # the path that PUBLISHES, so this is where an empty console must stop the train.
            dotnet pack "$p" --nologo -c Release -o out -p:GoldpathConsoleRequired=true
          done
          ls out
      # Supply chain, BEFORE the push (CRA Art. 14 from 2026-09-11; enterprise procurement
      # asks for both today). Order matters: if either step fails the train stays
      # unpublished, which is recoverable — a published train with no evidence is not.
      - name: syft (the SBOM generator)
        uses: anchore/sbom-action/download-syft@v0
      - name: SBOM of the train (CycloneDX, from the RELEASE outputs)
        # Strip the tag's leading `v` exactly as the release title does below: an SBOM
        # stamped "v0.1.0-preview.6" while the release and the CHANGELOG say
        # "0.1.0-preview.6" is an artifact a procurement reviewer cannot match to a
        # version by string compare (review #156 R3 — a CI-only path local runs never hit,
        # because a local run falls back to reading the CHANGELOG).
        run: |
          export GOLDPATH_VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/sbom.sh out/goldpath-sbom.cdx.json
      - name: provenance for every package (signed, keyless)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'out/*.nupkg'

      # Login LAST-MINUTE: the exchanged key lives ~1 hour, so it must be born next to
      # the push, never before the pack.
      - name: trusted-publishing login (OIDC -> temp key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: omercelikdev   # the nuget.org PROFILE name the policy belongs to
      - name: push to nuget.org
        run: |
          dotnet nuget push "out/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The tag's CHANGELOG section: EXACT bracketed-version match on the heading
          # (substring matching would let 0.1.0 also capture [0.1.0-preview.1]).
          awk -v v="$version" '/^## \[/{h = substr($0, index($0, "[") + 1); h = substr(h, 1, index(h, "]") - 1); p = (h == v)} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Goldpath $version" \
            --notes-file notes.md $(case "$version" in *-*) echo --prerelease;; esac) \
            out/goldpath-sbom.cdx.json
